name: ☁️ Deploy to GH Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
      - name: 🚀 Set version
        run: |
          echo $GITHUB_RUN_ID > version
      - name: 😈 Fetch bangs
        run: |
          curl -f "https://duckduckgo.com/bang.js" > assets/bangs.json
      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v5
      - name: ⬆️ Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: ⬆️ Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

