<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/duck.svg" />
    <link rel="stylesheet" href="src/global.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ununduck</title>
    <meta
      name="description"
      content="A better default search engine (with bangs!)"
    />
    <script src="src/main.js"></script>
  </head>
  <body style="background-color: transparent">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
      <div class="content-container">
        <h1>🚫🚫🦆</h1>
        <p>DuckDuckGo's bang redirects are slow and original unduck even slower (at least for me) because of it's slowanalytics. Add the following URL as a custom search engine to your browser. Enables <a href="https://duckduckgo.com/bang.html" target="_blank">all of DuckDuckGo's bangs.</a></p>
        <div class="url-container"> 
          <input 
            type="text" 
            class="url-input"
            value="https://ununduck.link?q=%s"
            readonly 
          />
          <button class="copy-button">
            <img src="assets/clipboard.svg" alt="Copy" />
          </button>
        </div>
      </div>
      <footer class="footer">
        <a href="https://github.com/t3dotgg/unduck" target="_blank">original by theo</a>
        •
        <a href="https://github.com/turleo/ununduck" target="_blank">remake by turleo</a>
      </footer>
    </div>
  </body>
</html>
